<article
  class="stat-card"
  [class.stat-card--accent-gold]="accent() === 'gold'"
  [class.stat-card--accent-wine]="accent() === 'wine'"
  [class.stat-card--accent-soft]="accent() === 'soft'"
  [class.stat-card--messages]="featured() === 'messages'"
  [class.stat-card--years]="featured() === 'years'"
  [style.--stat-anim-delay]="animationIndex() * 70 + 'ms'"
>
  @if (featured() === 'years') {
    <span class="stat-card__heart" aria-hidden="true">♥</span>
  }

  <p class="stat-card__value">{{ value() }}</p>
  <p class="stat-card__label">{{ label() }}</p>

  @if (description()) {
    <p class="stat-card__description">{{ description() }}</p>
  }
</article>
